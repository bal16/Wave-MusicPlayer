[project]
name = "wave-musicplayer"
version = "0.1.0"
description = "Wave Music Player — local music player (CustomTkinter + SQLModel)"
readme = "TODO.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=6.0.0",
    "loguru>=0.7.3",
    "pillow>=12.3.0",
    "sqlmodel>=0.0.42",
    "tinytag>=2.3.1",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pyinstaller>=6.22.2",
    "pyinstaller-hooks-contrib>=2026.7",
]

[tool.poe.tasks]
start     = { cmd = "python main.py", help = "Run the app" }
dev       = { cmd = "python main.py", help = "Run the app with debug logging", env = { LOGURU_LEVEL = "DEBUG" } }
check     = { cmd = "python -m py_compile main.py controller.py view.py config.py models/database.py models/schema.py", help = "Byte-compile all modules (no display needed)" }
build     = { sequence = [{ ref = "check" }, { ref = "build-exe" }], help = "Check + build onedir bundle into dist/Wave/" }
build-exe = { cmd = "pyinstaller wave.spec --noconfirm", help = "Build onedir bundle via wave.spec" }
dist      = { cmd = "pyinstaller wave-onefile.spec --noconfirm", help = "Build single-file binary into dist/Wave" }
clean     = { cmd = "python -c \"import shutil; [shutil.rmtree(d, ignore_errors=True) for d in ['build', 'dist']]\"", help = "Remove build/ and dist/" }
