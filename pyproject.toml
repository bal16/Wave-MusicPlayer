[project]
name = "wave-musicplayer"
version = "0.1.0"
description = "Wave Music Player — local music player"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=6.0.0",
    "loguru>=0.7.3",
    "pillow>=12.3.0",
    "sqlmodel>=0.0.42",
    "tinytag>=2.3.1",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pyinstaller>=6.22.2",
    "pyinstaller-hooks-contrib>=2026.7",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.poe.tasks]
start        = { cmd = "python main.py", help = "Run the app" }
dev          = { cmd = "python main.py", help = "Run the app with debug logging", env = { LOGURU_LEVEL = "DEBUG" } }
check        = { cmd = "python -m py_compile main.py controller.py view.py config.py models/database.py models/schema.py", help = "Byte-compile all modules (no display needed)" }
lint         = { cmd = "ruff check tests/ utils/icon_manager.py", help = "Lint new/tooling files only (legacy + dirty files excluded)" }
format       = { cmd = "ruff format tests/ utils/icon_manager.py", help = "Format new/tooling files only" }
format-check = { cmd = "ruff format --check tests/ utils/icon_manager.py", help = "Fail if new/tooling files are unformatted" }
test         = { cmd = "pytest", help = "Run test suite" }
quality      = { sequence = [{ ref = "check" }, { ref = "lint" }, { ref = "format-check" }, { ref = "test" }], help = "Full quality gate" }
build        = { sequence = [{ ref = "check" }, { ref = "build-exe" }], help = "Check + build onedir bundle into dist/Wave/" }
build-exe    = { cmd = "pyinstaller wave.spec --noconfirm", help = "Build onedir bundle via wave.spec" }
dist         = { cmd = "pyinstaller wave-onefile.spec --noconfirm", help = "Build single-file binary into dist/Wave" }
clean        = { cmd = "python -c \"import shutil; [shutil.rmtree(d, ignore_errors=True) for d in ['build', 'dist']]\"", help = "Remove build/ and dist/" }

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["__old", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
